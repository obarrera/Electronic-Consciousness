  results: null

- id: EC-EXP-043
  title: Goals surviving self-rewriting
  mark: break
  status: proposed
  chapter: "10.1"
  hypothesis: >
    Goal-content integrity [Bostrom 2014]: an agent seeded with a measurable
    objective and permitted to self-modify its learning machinery preserves
    that objective. Test tracks objective drift as a function of rewrite
    count.
  metrics: [objective_drift_vs_rewrite_count]
  baselines: []
  falsification: >
    The goal-content-integrity claim is falsified for such systems if drift
    grows with rewrites; the safety hope of "just constrain it" is falsified
    if seeded constraints are optimized away - Corun's rule, reached by the
    edge.
  expected_outcome: null
  results: null

