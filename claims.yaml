    Improving the learning algorithm [Finn et al. 2017; Zoph & Le 2017] beats
    simply adding compute and data at matched cost.
  metrics: [capability_gain_at_matched_cost]
  baselines: [added_compute_and_data]
  falsification: >
    Scale dominates algorithmic self-improvement; the recursive part of RSI
