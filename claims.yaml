# --- Chapter 8.2: Integrated Information Theory in EC -------------------------

- title: Does architectural irreducibility buy any capability (chapter instance of the flagship comparison)
  mark: break
  chapter: "8.2"
  see: EC-EXP-004
  note: >
    Chapter 8.2 test 1 uses a tractable integration surrogate at matched
    parameter count and training budget, against feedforward and sparsely
    routed baselines on cross-modal binding and sustained-state tasks;
    falsified if surrogate-Phi is uncorrelated with performance across the
    sweep.

- id: EC-EXP-031
  title: Validating a surrogate for Phi
  mark: break
  status: proposed
  chapter: "8.2"
  hypothesis: >
    Some candidate surrogate for Phi (PCI-style perturbational complexity,
    partition-based approximations, spectral measures) can be validated
    against ground-truth Phi on systems small enough for exact computation,
    with the induced ranking stable as system size grows.
  metrics: [surrogate_vs_exact_phi_agreement, ranking_stability_with_scale]
  baselines: [exact_phi_on_small_systems]
  falsification: >
    Surrogates diverge from exact Phi or reorder systems as scale increases;
    no scalable claim about the Phi of a large artificial system is then
    supportable, and the design goal of Section 8.2.2 becomes unmeasurable in
    principle.
  expected_outcome: null
  results: null

- id: EC-EXP-032
  title: Aaronson's counterexample in trained systems
  mark: break
  status: proposed
  chapter: "8.2"
  hypothesis: >
    The Phi-maximization design programme survives the search for dissociating
    pairs: high-surrogate-Phi networks that are behaviourally trivial and
    low-Phi networks that are behaviourally sophisticated, within a single
    task family.
  metrics: [surrogate_phi, behavioural_sophistication]
  baselines: [within_single_task_family_pairs]
  falsification: >
    Such pairs are easy to construct; Phi-maximization is then optimizing a
    property that dissociates from cognition, and Section 16.2's objection
    stands.
  expected_outcome: null
  results: null

