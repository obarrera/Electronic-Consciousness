# --- Chapter 10.1: Recursive Self-Improvement ---------------------------------

- id: EC-EXP-041
  title: Self-improvements compounding vs plateauing
  mark: break
  status: proposed
  chapter: "10.1"
  hypothesis: >
    The acceleration premise: gains from a system improving its own improver
    compound rather than plateau. Test applies an automated ML pipeline to
    improving its own search procedure across k iterations at fixed compute
    per iteration.
  metrics: [gain_per_iteration]
  baselines: []
  falsification: >
    Gains decay toward zero in that regime, the current expectation for most
    optimization processes.
  expected_outcome: "decay toward zero is the current expectation for most optimization processes"
  results: null

- id: EC-EXP-042
  title: Is the improver even the bottleneck
  mark: break
  status: proposed
  chapter: "10.1"
