    Hyperdimensional (vector-symbolic) codes beat learned embeddings where
    structure is compositional. Test is a vector-symbolic architecture
    [Kanerva 2009] vs learned dense embeddings at matched parameter and
    compute budget, on tasks requiring generalization to novel combinations
    of known parts; controls are identical training data and tuned baselines.
