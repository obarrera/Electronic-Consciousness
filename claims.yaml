# --- Chapter 6.1: The Golden Ratio in EC -------------------------------------

- title: phi-tapered layer widths (chapter instance of the flagship comparison)
  mark: break
  chapter: "6.1"
  see: EC-EXP-001
  note: >
    Chapter 6.1 test 1 adds controls at nearby taper ratios (1/1.5, 1/1.7) and
    a second kill condition: the claim also dies if the phi taper is
    indistinguishable from its neighbors. Stated honest expectation: both.

- id: EC-EXP-022
  title: Golden exploration splits
  mark: break
  status: proposed
  chapter: "6.1"
  hypothesis: >
    A fixed 61.8/38.2 exploitation-exploration division outperforms tuned
    epsilon-greedy, UCB, or Thompson sampling in bandit and RL settings. Test
    is standard exploration benchmarks, reporting regret against tuned
    adaptive baselines and against fixed splits of 60/40 and 65/35.
  metrics: [regret]
  baselines: [tuned_epsilon_greedy, ucb, thompson_sampling, fixed_60_40_split, fixed_65_35_split]
  falsification: >
    Adaptive methods dominate, or the neighboring constants tie. A surviving
    role for phi would require a theoretical argument of Kiefer's kind, and
    none is known for exploration.
  expected_outcome: "adaptive methods should dominate - the optimal split is problem-dependent, which no constant can be"
  results: null

- id: EC-EXP-023
  title: Golden resource allocation
  mark: break
  status: proposed
  chapter: "6.1"
  hypothesis: >
    In multi-objective or multi-subsystem EC designs (the first edition's
    smart-city 61.8/38.2 scenario), phi-proportioned allocation beats learned
    allocators or Pareto-front methods. Test is multi-objective benchmarks.
  metrics: [hypervolume, task_weighted_utility]
  baselines: [learned_allocation, evolved_allocation, neighboring_ratio_grid]
  falsification: >
    Losing to learned allocators is expected; tying with 60/40 is fatal to phi
    specifically.
  expected_outcome: "expected to lose to learned allocators"
  results: null

- id: EC-EXP-024
  title: The aesthetic residue of phi in interfaces
  mark: break
  status: proposed
  chapter: "6.1"
  hypothesis: >
    Even if phi optimizes nothing internal, phi-proportioned visualizations or
    interfaces for EC systems improve human comprehension or trust calibration
    relative to other pleasing proportions. Test is comprehension and
    calibration tasks with layout as the manipulated variable.
  metrics: [human_comprehension, trust_calibration]
  baselines: [other_pleasing_proportions]
  falsification: >
    No phi-specific effect, which is what the preference-experiment literature
    already suggests [Markowsky 1992]. Even a positive result would be a fact
    about human viewers, not about the machine.
  expected_outcome: "no phi-specific effect (Markowsky 1992)"
  results: null

# --- Chapter 6.2: Metatron's Cube in EC --------------------------------------

- title: The wiring claim (chapter instance of the flagship comparison)
  mark: break
  chapter: "6.2"
  see: EC-EXP-002
  note: >
    Chapter 6.2 test 1 adds random wirings [Xie et al. 2019] as the weakest
