# Machine-readable claim ledger for Electronic Consciousness (second edition).
# Marks follow the three-slates convention of Sections 16.1-16.2:
#   break  - empirically testable; the falsification condition is stated
#   circle - philosophical; no count settles it
#   wave   - mythic/narrative; true the way a road-song is true
#
# EC-EXP-001..005 are the five flagship controlled comparisons of Section 16.1.2.
# EC-EXP-006 onward are the per-chapter open questions and falsifiable tests.
# Where a chapter test IS one of the five flagship comparisons, a stub entry
# points to the flagship id via `see:` and records the chapter's added controls.
# Skipped (no stated falsification condition, only an "interpretation constraint"):
#   8.1 test 5 (COGITATE-style contrast in an artificial system)
#   8.2 test 4 (the unfolding argument, empirically)

# --- Flagship comparisons (Section 16.1.2) ---------------------------------

- id: EC-EXP-001
  title: phi-proportioned allocation vs learned allocation
  mark: break
  status: proposed
  chapter: "16.1"
  hypothesis: >
    Golden-ratio layer sizing and resource splits confer a stability or
    integration advantage. Test is matched networks at equal parameter budget,
    phi-proportioned vs arbitrarily proportioned vs optimized by architecture
    search [Elsken et al. 2019].
  metrics: [task_performance, training_stability, integration_proxy]
  baselines: [arbitrarily_proportioned_networks, architecture_search_optimized_networks]
  falsification: >
    The phi condition shows no consistent, replicated advantage over learned
    allocations.
  expected_outcome: "expected to lose (Markowsky 1992); the framework says so in advance"
  results: null

- id: EC-EXP-002
  title: Metatron-style topology vs known-good topologies
  mark: break
  status: proposed
  chapter: "16.1"
  hypothesis: >
    Symmetric geometric coupling patterns improve communication efficiency or
    lesion robustness. Test is against small-world wiring, attention-based
    connectivity, and NAS-discovered topologies at matched budgets.
  metrics: [communication_efficiency, lesion_robustness]
  baselines: [small_world_wiring, attention_based_connectivity, nas_discovered_topologies]
  falsification: >
    The geometric topology never reaches the performance-robustness Pareto
    frontier, leaving Metatron's Cube what Section 6.2 already concedes it may
    only be, a beautiful visualization.
  expected_outcome: "Section 6.2 concedes the figure may only be a beautiful visualization"
  results: null

- id: EC-EXP-003
  title: Workspace implementation vs its own ablation
  mark: break
  status: proposed
  chapter: "16.1"
  hypothesis: >
    An explicit bottleneck-plus-broadcast stage improves cross-module transfer
    and coordination [Baars 1988; Dehaene 2014; VanRullen & Kanai 2021]. Test
    is identical module sets with and without the workspace stage.
  metrics: [cross_module_transfer, coordination]
  baselines: [ablated_workspace_free_variant]
  falsification: >
    Ablated systems match the workspace systems.
  expected_outcome: "even success establishes functional utility only, not consciousness (Butlin et al. 2023)"
  results: null

- id: EC-EXP-004
  title: Integration measures as predictors
  mark: break
  status: proposed
  chapter: "16.1"
  hypothesis: >
    Approximate Phi predicts behavioral flexibility or robustness beyond
