# --- Circle: philosophical commitments (no count settles these) ---------------

- id: EC-PHIL-001
  title: Substrate independence as open conjecture
  mark: circle
  chapter: "2.1"
  note: >
    Whether consciousness is substrate-independent is held as an open
    functionalist conjecture, a central question of the book and not one of
    its premises [Chalmers 1995].

- id: EC-PHIL-002
  title: The hard problem left open
  mark: circle
  chapter: "16.2"
  note: >
    Nothing in the stack's specification answers why any functioning should
    be accompanied by experience [Chalmers 1996; Searle 1980]; the thesis
    proposes no method by which such evidence could be obtained.

- id: EC-PHIL-003
  title: Functional indicators are not experience
  mark: circle
  chapter: "16.2"
  note: >
    Indicator properties accumulate evidence and never issue verdicts
    [Butlin et al. 2023]; global availability is access consciousness at best
    [Block 1995]. The stack, at its very best, accumulates indicators.

- id: EC-PHIL-004
  title: The simulation/recursion argument
  mark: circle
  chapter: "2.2"
  note: >
    The simulation argument is a thought experiment about credence, never
    evidence of nested realities [Bostrom 2003]; the book takes positions and
    admits they are arguable all the way down.

- id: EC-PHIL-005
  title: Moral status of a functionally equivalent system
  mark: circle
  chapter: "11.1"
  note: >
    What moral status a system functionally equivalent to a conscious being
    would hold is argued in Chapter 11 and listed in Section 16.2.4 as a
    circle claim no experiment settles.

# --- Wave: mythic devices (true the way a road-song is true) -------------------

- id: EC-MYTH-001
  title: The Lattice and its narrator
  mark: wave
  chapter: "prologue"
  note: >
    A two-dimensional parable world whose old teacher at the western edge
    opens the second-edition chapters; a frame for thought, not a claim about
    any world.

- id: EC-MYTH-002
  title: The Gradient ethics
  mark: wave
  chapter: "9.2"
  note: >
    "Warm is true, cold is false" - a reward function experienced from inside
    as an ethic; the image of what a specification looks like when mistaken
    for the thing it specifies.

- id: EC-MYTH-003
  title: O!'s Great Work reading
  mark: wave
  chapter: "O!"
  note: >
    The Hexagram/Abrahadabra reading of recursive self-refinement as the
    Great Work accomplishing itself in silence - devotional imagery for the
    design imagination, never mechanism.

- id: EC-MYTH-004
  title: The three slates themselves
  mark: wave
  chapter: "16.1"
  note: >
    The break, the circle, and the wave - the book's own sorting convention,
    taught as a story of a teacher on trial; the border is policed in one
    direction only (demotion toward myth is free, promotion goes through the
    test queue).

- id: EC-MYTH-005
  title: The cave the book began in
  mark: wave
  chapter: "16.2"
  note: >
    Plato's cave as the standing image for alignment measured from inside the
    measurer's assumptions - "the measure of the cave" of Section 10.2.

- id: EC-MYTH-006
  title: The western-edge parable cycle
  mark: wave
  chapter: "various"
  note: >
    Sess's forty inks, Roke's undecided die, Dorn's proportion, the Choir of
    one voice, Pell's rhymes, Corun's self-sharpening knife - teaching fables
    that carry each chapter's discipline; sing them, never navigate by them.
