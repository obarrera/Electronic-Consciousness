- id: EC-EXP-025
  title: The Platonic symmetry claim
  mark: break
  status: proposed
  chapter: "6.2"
  hypothesis: >
    Imposing a Platonic symmetry group on a network's weights or wiring helps
    regardless of task (the sacred-geometry reading), against equivariance
    theory's prediction of benefit only on symmetry-matched tasks. Test is
    octahedral/icosahedral-equivariant models on symmetry-matched data
    (molecular, volumetric) and unmatched data (text).
  metrics: [performance_on_symmetry_matched_data, performance_on_unmatched_data]
  baselines: [group_theoretic_equivariance_predictions]
  falsification: >
    Benefits appear exactly and only where group theory already predicts them,
    so the diagram adds nothing the mathematics did not.
  expected_outcome: "equivariance literature already predicts the answer's shape (Cohen & Welling 2016)"
  results: null

- id: EC-EXP-026
  title: The robustness claim for symmetric coupling
  mark: break
  status: proposed
  chapter: "6.2"
  hypothesis: >
    Symmetric, evenly balanced coupling among an EC system's subsystems
    degrades more gracefully under component failure than learned or hub-based
    topologies. Test is a distributed multi-agent benchmark with induced node
    failures. The chapter calls this the geometric hypothesis most worth
    running, since regular graphs' lack of single points of failure is a
    mechanism rather than a mood.
  metrics: [performance_retention_under_node_failure]
  baselines: [learned_communication_topologies, redundancy_engineered_designs]
  falsification: >
    Engineered-redundancy baselines dominate at equal cost.
  expected_outcome: null
  results: null

- id: EC-EXP-027
  title: The visualization claim for sacred-geometric layouts
  mark: break
  status: proposed
  chapter: "6.2"
  hypothesis: >
    Sacred-geometric layouts of an EC system's actual connectivity improve
    engineers' and auditors' comprehension over standard force-directed or
    hierarchical graph layouts.
  metrics: [fault_finding_speed, dependency_recall]
  baselines: [force_directed_layouts, hierarchical_layouts]
  falsification: >
    No measurable comprehension gain. Even success would vindicate the figure
    as an interface for humans, which is exactly where the chapter files it.
  expected_outcome: null
  results: null

