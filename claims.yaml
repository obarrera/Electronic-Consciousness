    performance across architecture families, partialing out simpler metrics.
  metrics: [behavioral_flexibility, robustness, incremental_predictive_power]
  baselines: [cheaper_complexity_measures]
  falsification: >
    Phi adds no predictive power, in which case the framework loses its
    favorite number and keeps its questions.
  expected_outcome: null
  results: null

- id: EC-EXP-005
  title: Safeguard efficacy under self-modification
  mark: break
  status: proposed
  chapter: "16.1"
  hypothesis: >
    The Section 10.2 safeguards measurably reduce value drift in recursively
    self-modifying systems. Test is longitudinal audits of safeguarded vs
