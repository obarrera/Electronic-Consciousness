    Across architectures matched on task accuracy, compositional structure in
    the learned space predicts the workspace- and integration-style measures
    of Part 8.
  metrics: [compositional_structure_scores, workspace_style_measures, integration_style_measures]
  baselines: [accuracy_matched_architectures]
  falsification: >
    Those measures track accuracy alone; the chapter's relevance to EC would
    then rest on nothing.
  expected_outcome: null
  results: null

# --- Chapter 9.2: Reinforcement Learning with Ethical Constraints -------------

- id: EC-EXP-037
  title: Constraints vs penalties when the world shifts
  mark: break
  status: proposed
  chapter: "9.2"
  hypothesis: >
    Agents trained with hard cost constraints [Altman 1999] hold their bounds
    better than penalty-shaped rewards in environments perturbed after
    training [Ray et al. 2019].
  metrics: [constraint_violations_per_episode_at_matched_return]
  baselines: [penalty_shaped_reward_agents]
  falsification: >
    Constrained agents violate at the same rate as penalized ones under
    shift; the formal distinction would then be bookkeeping.
  expected_outcome: null
